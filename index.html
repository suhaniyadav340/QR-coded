<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR CODE</title>
    <link rel="stylesheet" href="styling.css">
<script>
    function qr()
    {
        var a=mytext.value
        var b="https://api.qrserver.com/v1/create-qr-code/?data="+a;
        myqr.src=b;
    }
</script>
</head>
<body>
    <div class="container">
    <h1>Generate Payment QR Code</h1>
    enter any text
    <input id="mytext"/>
    <button onclick="qr()">generate qr</button>
    <hr/>
    <img id="myqr"/>
    </div>
</body>
</html>
